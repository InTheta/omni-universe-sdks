name: Public data quality

on:
  pull_request:
    paths:
      - "packages/typescript/**"
      - ".github/workflows/public-data-quality.yml"
  push:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - ".github/workflows/public-data-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public data package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install exact dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply and check reviewed Coinbase schema compatibility patch
        run: |
          node docs/migrate-coinbase-schemas.cjs
          node docs/migrate-coinbase-schemas.cjs --check
      - name: Verify bounded offline public data and optional broker fixtures
        # This command tests mock requests and synthetic keys. No repository
        # secrets, live contracts, funded lifecycle, publishing or deployment.
        run: npm run verify
      - name: Audit complete installed dependency tree
        run: npm audit

